[package]
edition      = "2024"
name         = "spike-net"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "spike-net"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

# Static IPv4 config: the AP is the DHCP server (edge-dhcp), so embassy-net's
# DHCP client (`dhcpv4`) is not needed. embassy-net pulls in its own smoltcp.
embassy-net = { version = "0.9.1", features = [
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "esp-alloc",
  "esp32s3",
  "log-04",
  "unstable",
  "wifi",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"

# DHCP server + UDP on embassy-net, and the HTTP server. All three track
# embassy-net 0.9 (the template's version), so there is a single stack.
edge-dhcp        = "0.8.0"
edge-nal         = "0.7.0"
edge-nal-embassy = { version = "0.9.0", default-features = false, features = [
  "medium-ethernet",
  "proto-ipv4",
  "udp",
] }
picoserve = { version = "0.20.1", features = ["embassy"] }
heapless = "0.9.3"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
